version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: drishtirakshak-db
    environment:
      POSTGRES_USER: drishtirakshak
      POSTGRES_PASSWORD: drishtirakshak_secure_password
      POSTGRES_DB: drishtirakshak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishtirakshak -d drishtirakshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drishtirakshak-web
    command: python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-only-4b1c9e2a7f6d8035a1c4e9b20d7f6a83c5e1b904d2f70a6c
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_URL=postgres://drishtirakshak:drishtirakshak_secure_password@db:5432/drishtirakshak
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
